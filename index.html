    <!-- Keep third-party work out of the critical rendering window. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var thirdPartyLoaded = false;
      function loadThirdParty() {
        if (thirdPartyLoaded) return;
        thirdPartyLoaded = true;

        var adsPreconnect = document.createElement('link');
        adsPreconnect.rel = 'preconnect';
        adsPreconnect.href = 'https://pagead2.googlesyndication.com';
        document.head.appendChild(adsPreconnect);

        var ads = document.createElement('script');
        ads.async = true;
        ads.crossOrigin = 'anonymous';
        ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3017224444327111';
        document.head.appendChild(ads);

        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-P1T49E92ZB';
        document.head.appendChild(ga);

        gtag('js', new Date());
        gtag('config', 'G-P1T49E92ZB');
      }
      function scheduleThirdParty() {
        var interactionEvents = ['pointerdown', 'keydown', 'touchstart'];
        var onInteraction = function () {
          interactionEvents.forEach(function (eventName) {
            window.removeEventListener(eventName, onInteraction);
          });
          loadThirdParty();
        };
        interactionEvents.forEach(function (eventName) {
          window.addEventListener(eventName, onInteraction, { once: true, passive: true });
        });

        // Preserve analytics and ads for passive visitors without delaying the
        // first screen or competing with initial input responsiveness.
        setTimeout(loadThirdParty, 12000);
      }
      if (document.readyState === 'complete') {
        scheduleThirdParty();
      } else {
        window.addEventListener('load', scheduleThirdParty);
      }
    </script>
    <script>
      (function () {
        var KEY = '__chunk_reload_at';
        function isChunkError(msg) {
          msg = String(msg || '');
          return msg.indexOf('Failed to fetch dynamically imported module') !== -1
            || msg.indexOf('error loading dynamically imported module') !== -1
            || msg.indexOf('Importing a module script failed') !== -1;
        }
        function recover() {
          var last = 0;
          try { last = parseInt(sessionStorage.getItem(KEY) || '0', 10); } catch (err) {}
          if (Date.now() - last < 10000) return;
          try { sessionStorage.setItem(KEY, String(Date.now())); } catch (err) {}
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}).then(function () { window.location.reload(); });
          } else {
            window.location.reload();
          }
        }
        window.addEventListener('error', function (e) {
          if (isChunkError(e && e.message)) recover();
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          if (isChunkError(r && r.message ? r.message : r)) recover();
        });
      })();
    </script>
